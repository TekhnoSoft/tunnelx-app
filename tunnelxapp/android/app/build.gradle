apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // New Architecture: use default from React Native (do not override here)
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def signingProps = new Properties()
def localProps = new Properties()

def localPropsRootFile = rootProject.file("local.properties")
if (localPropsRootFile.exists()) {
    localPropsRootFile.withInputStream { localProps.load(it) }
}
def localPropsAppFile = file("local.properties")
if (localPropsAppFile.exists()) {
    localPropsAppFile.withInputStream { localProps.load(it) }
}

def signingPropsRootFile = rootProject.file("key.properties")
if (signingPropsRootFile.exists()) {
    signingPropsRootFile.withInputStream { signingProps.load(it) }
}
def signingPropsAppFile = file("key.properties")
if (signingPropsAppFile.exists()) {
    signingPropsAppFile.withInputStream { signingProps.load(it) }
}

def getSigningValue = { String key ->
    def v = System.getenv(key)
    if (v != null && v.toString().trim()) return v.toString().trim()
    if (project.hasProperty(key)) {
        def pv = project.property(key)?.toString()
        if (pv != null && pv.trim()) return pv.trim()
    }
    def fpv = signingProps.getProperty(key)
    if (fpv != null && fpv.toString().trim()) return fpv.toString().trim()
    def lpv = localProps.getProperty(key)
    if (lpv != null && lpv.toString().trim()) return lpv.toString().trim()
    return null
}

def releaseStoreFile = getSigningValue("TUNNELXAPP_UPLOAD_STORE_FILE")
def releaseStorePassword = getSigningValue("TUNNELXAPP_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = getSigningValue("TUNNELXAPP_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = getSigningValue("TUNNELXAPP_UPLOAD_KEY_PASSWORD")

def isReleaseBuildRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (isReleaseBuildRequested) {
    def missing = []
    if (!releaseStoreFile) missing << "TUNNELXAPP_UPLOAD_STORE_FILE"
    if (!releaseStorePassword) missing << "TUNNELXAPP_UPLOAD_STORE_PASSWORD"
    if (!releaseKeyAlias) missing << "TUNNELXAPP_UPLOAD_KEY_ALIAS"
    if (!releaseKeyPassword) missing << "TUNNELXAPP_UPLOAD_KEY_PASSWORD"
    if (!missing.isEmpty()) throw new GradleException(
        """Missing signing config: ${missing.join(", ")}

To build a RELEASE (AAB/APK), set these values as environment variables or Gradle properties.

PowerShell example:
  cd android
  \$env:TUNNELXAPP_UPLOAD_STORE_FILE="tunnelxapp-upload.keystore"
  \$env:TUNNELXAPP_UPLOAD_STORE_PASSWORD="YOUR_PASSWORD"
  \$env:TUNNELXAPP_UPLOAD_KEY_ALIAS="tunnelxapp"
  \$env:TUNNELXAPP_UPLOAD_KEY_PASSWORD="YOUR_PASSWORD"
  .\\gradlew.bat :app:bundleRelease

Or pass as -P (no env needed):
  .\\gradlew.bat :app:bundleRelease \"-PTUNNELXAPP_UPLOAD_STORE_FILE=tunnelxapp-upload.keystore\" \"-PTUNNELXAPP_UPLOAD_STORE_PASSWORD=YOUR_PASSWORD\" \"-PTUNNELXAPP_UPLOAD_KEY_ALIAS=tunnelxapp\" \"-PTUNNELXAPP_UPLOAD_KEY_PASSWORD=YOUR_PASSWORD\"

Or create android/key.properties (or android/app/key.properties) with:
  TUNNELXAPP_UPLOAD_STORE_FILE=tunnelxapp-upload.keystore
  TUNNELXAPP_UPLOAD_STORE_PASSWORD=YOUR_PASSWORD
  TUNNELXAPP_UPLOAD_KEY_ALIAS=tunnelxapp
  TUNNELXAPP_UPLOAD_KEY_PASSWORD=YOUR_PASSWORD

Or put the same keys in android/local.properties (this file is already ignored by git).
"""
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tunnelxapp"
    defaultConfig {
        applicationId "com.tunnelxapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // WireGuard tunnel library (official)
    implementation("com.wireguard.android:tunnel:1.0.20250531")
    // Desugaring for Java 8+ APIs used by the tunnel library
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}
